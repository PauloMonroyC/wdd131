<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="author" content="Paulo Andree Monroy Cotrina">
    <meta name="description" content="Develop responsive web pages using valid HTML, CSS, and JavaScript while building skills in teamwork, communication, collaboration, and deadlines.">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

</head>
<body>
    <header>
        <h1> Product Review Form</h1>
    </header>
    <main>
        <form method="get" action="review.html" class="form">
        <fieldset>
            <label>Product Name
                <select name="product" id="product" required>
                    <option value="" disabled selected>Select a Product</option>


                </select>
            </label>
        </fieldset>

        <fieldset>
            <label>Overall Rating
                <div class="stars">
                    <input type="radio" id="onestar" name="stars" value="1" required><label for="onestar"></label>
                    <input type="radio" id="twostar" name="stars" value="2" required><label for="twostar"></label>
                    <input type="radio" id="threestar" name="stars" value="3" required><label for="threestar"></label>
                    <input type="radio" id="fourstar" name="stars" value="4" required><label for="fourstar"></label>
                    <input type="radio" id="fivestar" name="stars" value="5" required><label for="fivestar"></label>

                </div>
            </label>
        </fieldset>

        <fieldset>
            <label>Date of Installation <input id="instaldate" type="date" name="completeDate" required></label>
            
        </fieldset>

        <fieldset>
            <div>Which features did you find useful in the product? (Check all that apply)</div>
            
            <label> <input id="feature-1" type="checkbox" name="durability" value="yes">Durability</label>
            <label> <input id="feature-2" type="checkbox" name="easeofuse" value="yes">Ease Of Use</label>
            <label> <input id="feature-3" type="checkbox" name="performance" value="yes">Performance</label>
            <label> <input id="feature-4" type="checkbox" name="Design" value="yes">Design</label>
            
        </fieldset>

        <fieldset>
            <label for="review">Written Review (optional)</label>
            <textarea id="review" name="review"></textarea>
        </fieldset>

        <fieldset>
            <label>Your Name (optional) <input type="text" id="name" name="user-name"></label>
        </fieldset>

        <input type="submit" value="Send My Review">


        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> ⚪🔴 Paulo Andreé Monroy Cotrina 🔴⚪ Lima, Perú</p>
        <p id="lastModified"></p>
    </footer>
    
</body>
</html>
